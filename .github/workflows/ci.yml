name: ML Pipeline CI-Asssignment3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/train.txt

    - name: Run Unit Tests
      run: |
        # Dynamically append the exact directory containing the 'src' folder to the python path
        SRC_PATH=$(find . -type d -name "src" -o -type d -name "Src" | head -n 1)
        ROOT_DIR=$(dirname "$SRC_PATH")
        echo "Resolved Python package root to: $ROOT_DIR"
        
        # Force execute pytest with the correct path mapping override
        pytest -o "pythonpath=$ROOT_DIR" $(find . -type d -name "tests")
