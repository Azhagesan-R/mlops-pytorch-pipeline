name: ML Pipeline CI-Asssignment3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Dynamically find the requirements file if it is nested inside a subfolder
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        REQ_FILE=$(find . -name train.txt | head -n 1)
        pip install -r "$REQ_FILE"

    # Dynamically find the tests folder and pass its specific parent directory to Python
    - name: Run Unit Tests
      run: |
        TEST_DIR=$(find . -type d -name tests | head -n 1)
        SRC_PARENT=$(dirname "$TEST_DIR")
        pytest -o "pythonpath=$SRC_PARENT" "$TEST_DIR"
